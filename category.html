<!DOCTYPE html>
<html lang="zh-CN" class="dark">

    <title>分类点评</title>
    <style id="theme-vars">
/* ============================================================
   Im-chc 个人博客 · 深色简约现代主题
   brand prefix: im
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

/* ---------- Dark base (default) ---------- */
:root {
  --im-background: #0b0d12;
  --im-foreground: #eaeef7;
  --im-card: #12151d;
  --im-card-foreground: #eaeef7;
  --im-popover: #171b26;
  --im-popover-foreground: #eaeef7;
  --im-primary: #7c8cff;
  --im-primary-foreground: #0b0d12;
  --im-muted: #141824;
  --im-muted-foreground: #8f98ac;
  --im-border: #1e2330;
  --im-input: #1e2330;
  --im-ring: rgba(124, 140, 255, 0.45);
  --im-radius-small: 4px;
  --im-radius-medium: 8px;
  --im-radius-large: 12px;
  --im-radius-full: 9999px;

  /* brand primary scale (single hue: indigo) */
  --im-primary-50: #eef0ff;
  --im-primary-100: #e0e3ff;
  --im-primary-200: #c6ccff;
  --im-primary-300: #a6adff;
  --im-primary-400: #8f98ff;
  --im-primary-500: #7c8cff;
  --im-primary-600: #636ef0;
  --im-primary-700: #4d55d0;
  --im-primary-800: #3f45a3;
  --im-primary-900: #363b7e;

  /* neutral scale (dark) */
  --im-neutral-50: #f3f5fa;
  --im-neutral-100: #e7eaf2;
  --im-neutral-200: #c9cfdc;
  --im-neutral-300: #9aa3b5;
  --im-neutral-400: #6b7488;
  --im-neutral-500: #4a5163;
  --im-neutral-600: #323848;
  --im-neutral-700: #242936;
  --im-neutral-800: #1a1e28;
  --im-neutral-900: #12151d;

  /* semantic state colors */
  --state-success: #3ddc97;
  --state-warning: #f5b544;
  --state-error: #f56565;
  --state-info: #4aa8ff;

  --im-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
  --im-shadow-md: 0 4px 14px rgba(0, 0, 0, 0.05);
  --im-shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.05);
}

/* ---------- Light alternative ---------- */
.light {
  --im-background: #f6f7fb;
  --im-foreground: #141824;
  --im-card: #ffffff;
  --im-card-foreground: #141824;
  --im-popover: #ffffff;
  --im-popover-foreground: #141824;
  --im-primary: #5565e8;
  --im-primary-foreground: #ffffff;
  --im-muted: #eceef5;
  --im-muted-foreground: #5b6478;
  --im-border: #e3e7f0;
  --im-input: #e3e7f0;
  --im-ring: rgba(85, 101, 232, 0.35);
  --im-shadow-sm: 0 1px 2px rgba(20, 24, 36, 0.04);
  --im-shadow-md: 0 4px 14px rgba(20, 24, 36, 0.05);
  --im-shadow-lg: 0 12px 32px rgba(20, 24, 36, 0.06);
}

/* ---------- Typography ---------- */
.font-sans,
body {
  font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

.font-display {
  font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  letter-spacing: -0.02em;
}

.text-hero {
  font-size: clamp(2rem, 4.5vw, 3.4rem);
  line-height: 1.12;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.text-section {
  font-size: clamp(1.35rem, 2.4vw, 1.8rem);
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: -0.02em;
}

/* ---------- Base polish ---------- */
::selection {
  background: var(--im-primary);
  color: var(--im-primary-foreground);
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--im-background);
  color: var(--im-foreground);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* subtle ambient glow used by hero/cards */
.ambient-glow {
  background:
    radial-gradient(60% 80% at 20% 10%, rgba(124, 140, 255, 0.16), transparent 60%),
    radial-gradient(50% 70% at 90% 20%, rgba(124, 140, 255, 0.08), transparent 60%);
}

.card-surface {
  background: var(--im-card);
  border: 1px solid var(--im-border);
  border-radius: var(--im-radius-large);
}

/* scrollbar */
::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--im-neutral-700);
  border-radius: 9999px;
  border: 2px solid var(--im-background);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--im-neutral-600);
}

<body class="min-h-screen font-sans antialiased">
  <style id="critical-layout">
    .shell-root{min-height:100vh;background:var(--im-background);display:flex;flex-direction:column}
    .site-header{position:sticky;top:0;z-index:40;width:100%;border-bottom:1px solid var(--im-border);background:color-mix(in srgb,var(--im-background) 85%,transparent);backdrop-filter:blur(10px)}
    .logo-mark{background:color-mix(in srgb,var(--im-primary) 14%,transparent);color:var(--im-primary)}
    .nav-item{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--im-muted-foreground);transition:color .16s ease,background .16s ease}
    .nav-item:hover{color:var(--im-foreground);background:color-mix(in srgb,var(--im-primary) 8%,transparent)}
    .nav-item[data-active="true"]{color:var(--im-primary);background:color-mix(in srgb,var(--im-primary) 12%,transparent)}
    .btn-primary{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:8px;background:var(--im-primary);color:var(--im-primary-foreground);font-size:14px;font-weight:600;transition:transform .16s ease,opacity .16s ease}
    .btn-primary:hover{transform:translateY(-1px);opacity:.92}
    .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:8px;color:var(--im-muted-foreground);transition:color .16s ease,background .16s ease}
    .icon-btn:hover{color:var(--im-foreground);background:color-mix(in srgb,var(--im-primary) 8%,transparent)}
    .cat-card{position:relative;display:block;overflow:hidden;border-radius:18px;border:1px solid var(--im-border);background:var(--im-card);transition:border-color .16s ease,transform .16s ease}
    .cat-card:hover{border-color:color-mix(in srgb,var(--im-primary) 40%,var(--im-border));transform:translateY(-4px)}
    .cat-card img{width:100%;height:210px;object-fit:cover;display:block}
    .cat-card .shade{position:absolute;top:0;left:0;right:0;height:210px;background:linear-gradient(180deg,transparent 40%,color-mix(in srgb,var(--im-card) 94%,transparent))}
    .cat-body{padding:18px}
    .cat-icon{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--im-primary) 14%,transparent);color:var(--im-primary)}
    .cat-count{font-size:12px;color:var(--im-muted-foreground);font-variant-numeric:tabular-nums}
  </style>

  <div class="shell-root">
    <header class="site-header">
      <div class="mx-auto flex h-[72px] w-full max-w-6xl items-center justify-between px-6">
        <a href="index.html" class="flex min-w-0 items-center gap-2.5" aria-label="Im-chc 首页">
          <span class="logo-mark flex h-9 w-9 shrink-0 items-center justify-center rounded-lg">
            <i data-lucide="sparkles" class="h-[18px] w-[18px]"></i>
          </span>
          <span class="font-display truncate text-lg font-bold tracking-tight">Im-chc</span>
        </a>
        <nav class="flex items-center gap-1" aria-label="主导航">
          <a href="index.html" data-nav-key="home" data-dom-id="tab-home" class="nav-item">首页</a>
          <a href="life.html" data-nav-key="life" data-dom-id="tab-life" class="nav-item">人生时刻</a>
          <a href="category.html" data-nav-key="category" data-active="true" class="nav-item">分类点评</a>
          <a href="blog.html" data-nav-key="blog" data-dom-id="tab-blog" class="nav-item">博客创作</a>
        </nav>
        <div class="flex items-center gap-3">
          <a href="blog.html" data-dom-id="cta-blog" class="btn-primary">
            <i data-lucide="pen-line" class="h-4 w-4"></i>
            <span>开始创作</span>
          </a>
          <button type="button" class="icon-btn" aria-label="搜索">
            <i data-lucide="search" class="h-[18px] w-[18px]"></i>
          </button>
        </div>
      </div>
    </header>

    <main class="w-full max-w-6xl self-center px-6 pb-6 pt-8">
      <div class="mb-6">
        <h1 class="font-display text-3xl font-bold">分类点评</h1>
        <p class="mt-2 text-sm text-muted-foreground">电影、音乐、旅行与美食，四类生活切片</p>
      </div>

      <section class="grid gap-5 sm:grid-cols-2 lg:grid-cols-4" aria-label="分类卡片">
        <a href="#" class="cat-card">
          <img src="assets/category-cinema.svg" alt="电影分类">
          <div class="shade"></div>
          <div class="cat-body">
            <div class="flex items-center gap-3">
              <span class="cat-icon"><i data-lucide="clapperboard" class="h-5 w-5"></i></span>
              <div class="min-w-0">
                <h2 class="font-display text-lg font-bold">电影</h2>
                <p class="cat-count">24 篇影评</p>
              </div>
            </div>
            <p class="mt-3 line-clamp-2 text-sm leading-relaxed text-muted-foreground">从商业大片到独立文艺，记录每一次银幕前的触动。</p>
          </div>
        </a>
        <a href="#" class="cat-card">
          <img src="assets/category-music.svg" alt="音乐分类">
          <div class="shade"></div>
          <div class="cat-body">
            <div class="flex items-center gap-3">
              <span class="cat-icon"><i data-lucide="disc" class="h-5 w-5"></i></span>
              <div class="min-w-0">
                <h2 class="font-display text-lg font-bold">音乐</h2>
                <p class="cat-count">31 张专辑</p>
              </div>
            </div>
            <p class="mt-3 line-clamp-2 text-sm leading-relaxed text-muted-foreground">黑胶与耳机的双修党，偏爱深夜时分的低频与呢喃。</p>
          </div>
        </a>
        <a href="#" class="cat-card">
          <img src="assets/category-travel.svg" alt="旅行分类">
          <div class="shade"></div>
          <div class="cat-body">
            <div class="flex items-center gap-3">
              <span class="cat-icon"><i data-lucide="compass" class="h-5 w-5"></i></span>
              <div class="min-w-0">
                <h2 class="font-display text-lg font-bold">旅行</h2>
                <p class="cat-count">18 段旅程</p>
              </div>
            </div>
            <p class="mt-3 line-clamp-2 text-sm leading-relaxed text-muted-foreground">山海与街巷，攻略与偶遇，都在这里慢慢写。</p>
          </div>
        </a>
        <a href="#" class="cat-card">
          <img src="assets/category-food.svg" alt="美食分类">
          <div class="shade"></div>
          <div class="cat-body">
            <div class="flex items-center gap-3">
              <span class="cat-icon"><i data-lucide="utensils" class="h-5 w-5"></i></span>
              <div class="min-w-0">
                <h2 class="font-display text-lg font-bold">美食</h2>
                <p class="cat-count">42 家店</p>
              </div>
            </div>
            <p class="mt-3 line-clamp-2 text-sm leading-relaxed text-muted-foreground">巷口小馆与深夜食堂，用味觉记住一座城。</p>
          </div>
        </a>
      </section>
    </main>

    <footer class="w-full border-t border-border bg-background">
      <div class="mx-auto flex w-full max-w-6xl items-center justify-between px-6 py-8">
        <div class="flex items-center gap-2.5">
          <span class="logo-mark flex h-7 w-7 items-center justify-center rounded-md">
            <i data-lucide="sparkles" class="h-3.5 w-3.5"></i>
          </span>
          <span class="font-display text-sm font-semibold">Im-chc 个人博客</span>
        </div>
        <p class="text-sm text-muted-foreground">© 2026 Im-chc · 用代码记录生活</p>
      </div>
    </footer>
  </div>

  <script>lucide.createIcons();</script>
</body>
