<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类点评</title>
    <style id="theme-vars">
/* ============================================================
   Im-chc 个人博客 · 苹果风格响应式主题（草稿版）
   brand prefix: im
   参考设计系统: Pinguo / Apple HIG
   要点: Space Black + Silver Mist + System Blue，DM Sans 正文、
   JetBrains Mono 技术字，1px 边框 + 轻声阴影，胶囊按钮，
   大圆角，留白优先；全设备响应式（390/768/1024/1440）。
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

/* ---------- Apple System Palette ---------- */
:root {
  /* brand blue scale (System Blue #007AFF anchored) */
  --im-primary-50: #e8f2ff;
  --im-primary-100: #cfe5ff;
  --im-primary-200: #9fcbff;
  --im-primary-300: #66abff;
  --im-primary-400: #2e8dff;
  --im-primary-500: #007aff;
  --im-primary-600: #0064d6;
  --im-primary-700: #004fad;
  --im-primary-800: #003b82;
  --im-primary-900: #00275a;

  /* neutral scale (dark: Space Black family) */
  --im-neutral-50: #f5f5f7;
  --im-neutral-100: #e3e3e8;
  --im-neutral-200: #c7c7cc;
  --im-neutral-300: #aeaeb2;
  --im-neutral-400: #8e8e93;
  --im-neutral-500: #6e6e73;
  --im-neutral-600: #48484a;
  --im-neutral-700: #3a3a3c;
  --im-neutral-800: #2c2c2e;
  --im-neutral-900: #1c1c1e;

  /* semantic state colors */
  --state-success: #34c759;
  --state-success-dark: #30d158;
  --state-warning: #ff9f0a;
  --state-error: #ff3b30;
  --state-error-dark: #ff453a;
  --state-info: #0a84ff;
}

/* ---------- Dark base (default) ---------- */
:root {
  --im-background: #000000;
  --im-foreground: #f5f5f7;
  --im-card: #1c1c1e;
  --im-card-foreground: #f5f5f7;
  --im-popover: #3a3a3c;
  --im-popover-foreground: #f5f5f7;
  --im-primary: #2e8dff;
  --im-primary-foreground: #ffffff;
  --im-muted: #1c1c1e;
  --im-muted-foreground: #8e8e93;
  --im-accent: #2c2c2e;
  --im-accent-foreground: #f5f5f7;
  --im-border: #3a3a3c;
  --im-input: #3a3a3c;
  --im-ring: rgba(46, 141, 255, 0.5);
  --im-radius-small: 8px;
  --im-radius-medium: 14px;
  --im-radius-large: 20px;
  --im-radius-full: 9999px;

  --im-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --im-shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44);
  --im-shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
}

/* ---------- Light alternative (Silver Mist family) ---------- */
.light {
  --im-background: #f5f5f7;
  --im-foreground: #1d1d1f;
  --im-card: #ffffff;
  --im-card-foreground: #1d1d1f;
  --im-popover: #ffffff;
  --im-popover-foreground: #1d1d1f;
  --im-primary: #007aff;
  --im-primary-foreground: #ffffff;
  --im-muted: #f2f2f7;
  --im-muted-foreground: #6e6e73;
  --im-accent: #f2f2f7;
  --im-accent-foreground: #1d1d1f;
  --im-border: #d1d1d6;
  --im-input: #d1d1d6;
  --im-ring: rgba(0, 122, 255, 0.35);
  --im-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --im-shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06);
  --im-shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08);
}

/* ---------- Typography ---------- */
.font-sans,
body {
  font-family: 'DM Sans', 'Noto Sans SC', system-ui, -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

.font-display {
  font-family: 'DM Sans', 'Noto Sans SC', system-ui, sans-serif;
  letter-spacing: -0.02em;
}

.font-mono {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
}

.text-hero {
  font-size: clamp(2rem, 5vw, 3.75rem);
  line-height: 0.95;
  font-weight: 600;
  letter-spacing: -0.04em;
}

.text-section {
  font-size: clamp(1.4rem, 2.4vw, 1.9rem);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.02em;
}

/* ---------- Base polish ---------- */
::selection {
  background: var(--im-primary);
  color: var(--im-primary-foreground);
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  background: var(--im-background);
  color: var(--im-foreground);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

.card-surface {
  background: var(--im-card);
  border: 1px solid var(--im-border);
  border-radius: var(--im-radius-large);
}

/* ---------- Apple component primitives (responsive) ---------- */

/* Pill button */
.btn-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 20px;
  border: none;
  border-radius: var(--im-radius-full);
  background: var(--im-primary);
  color: var(--im-primary-foreground);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: filter .18s ease, transform .18s ease, opacity .18s ease;
}
.btn-pill:hover { filter: brightness(.95); }
.btn-pill:active { transform: scale(.98); }
.btn-pill:disabled { opacity: .42; cursor: not-allowed; }

/* Secondary pill */
.btn-pill-secondary {
  background: var(--im-muted);
  color: var(--im-foreground);
  border: 1px solid var(--im-border);
}
.btn-pill-secondary:hover { filter: brightness(1.06); }

/* Top nav item (Apple Store style) */
.nav-item {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 0 14px;
  border-radius: var(--im-radius-full);
  font-size: 13px;
  font-weight: 500;
  color: var(--im-muted-foreground);
  transition: color .18s ease, background .18s ease;
  white-space: nowrap;
}
.nav-item:hover { color: var(--im-foreground); background: var(--im-accent); }
.nav-item[data-active="true"] { color: var(--im-primary); background: color-mix(in srgb, var(--im-primary) 14%, transparent); }

/* Mobile bottom tab bar (Apple-style, blur + safe-area) */
.mobile-tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 64px;
  padding-bottom: env(safe-area-inset-bottom, 0);
  border-top: 1px solid var(--im-border);
  background: color-mix(in srgb, var(--im-background) 82%, transparent);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
}
.mobile-tabbar .mtab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 44px;
  min-height: 44px;
  padding: 6px 12px;
  border-radius: var(--im-radius-medium);
  color: var(--im-muted-foreground);
  font-size: 10px;
  font-weight: 500;
  text-decoration: none;
  transition: color .18s ease;
}
.mobile-tabbar .mtab[data-active="true"] { color: var(--im-primary); }
.mobile-tabbar .mtab i { width: 20px; height: 20px; }

/* Hide top nav on mobile, show tab bar; hide tab bar on desktop */
@media (max-width: 767px) {
  .desktop-nav { display: none !important; }
  .desktop-cta { display: none !important; }
  .mobile-tabbar { display: flex; }
}
@media (min-width: 768px) {
  .mobile-tabbar { display: none; }
}

/* Fluid container */
.shell-main {
  width: 100%;
  max-width: 1152px;
  margin: 0 auto;
  padding-left: clamp(16px, 4vw, 32px);
  padding-right: clamp(16px, 4vw, 32px);
}

/* Responsive card grid helpers (fallback if Tailwind delayed) */
.grid-auto-1 { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 640px)  { .grid-auto-2 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .grid-auto-3 { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 768px)  { .grid-auto-2 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .grid-auto-4 { grid-template-columns: repeat(4, 1fr); } }

/* Minimal scrollbar (quiet, Apple-like) */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--im-neutral-700); border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background: var(--im-neutral-600); }

<body class="min-h-screen font-sans antialiased">
  <style id="critical-layout">
    /* ===== Im-chc 分类点评 · 关键布局（自包含，不依赖 Tailwind 运行时） ===== */
    *, *::before, *::after { box-sizing: border-box; }

    .shell-root {
      min-height: 100vh;
      background: var(--im-background);
      display: flex;
      flex-direction: column;
    }
    @media (max-width: 767px) {
      .shell-root { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px) + 16px); }
    }

    /* ---- 桌面 44px Apple Store 式深色顶栏 ---- */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 44px;
      width: 100%;
      border-bottom: 1px solid var(--im-border);
      background: color-mix(in srgb, var(--im-background) 82%, transparent);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
    }
    .site-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 44px;
      max-width: 1152px;
      margin: 0 auto;
      padding-left: clamp(14px, 3.5vw, 32px);
      padding-right: clamp(14px, 3.5vw, 32px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      text-decoration: none;
      color: var(--im-foreground);
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      flex: none;
      background: color-mix(in srgb, var(--im-primary) 14%, transparent);
      color: var(--im-primary);
    }
    .brand .logo-mark svg, .brand .logo-mark i { width: 13px; height: 13px; }
    .brand-name { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }

    .desktop-nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .nav-item {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 12px;
      border-radius: var(--im-radius-full);
      font-size: 13px;
      font-weight: 500;
      color: var(--im-muted-foreground);
      text-decoration: none;
      white-space: nowrap;
      transition: color .18s cubic-bezier(.32,.72,0,1), background .18s cubic-bezier(.32,.72,0,1);
    }
    .nav-item:hover { color: var(--im-foreground); background: var(--im-accent); }
    .nav-item[data-active="true"] {
      color: var(--im-primary);
      background: color-mix(in srgb, var(--im-primary) 14%, transparent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 14px;
      border-radius: var(--im-radius-full);
      background: var(--im-primary);
      color: var(--im-primary-foreground);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
      transition: filter .18s cubic-bezier(.32,.72,0,1), transform .18s cubic-bezier(.32,.72,0,1);
    }
    .header-cta:hover { filter: brightness(.92); }
    .header-cta:active { transform: scale(.97); }
    .header-cta svg, .header-cta i { width: 14px; height: 14px; }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: var(--im-radius-full);
      border: none;
      background: transparent;
      color: var(--im-muted-foreground);
      cursor: pointer;
      transition: color .18s cubic-bezier(.32,.72,0,1), background .18s cubic-bezier(.32,.72,0,1);
    }
    .icon-btn:hover { color: var(--im-foreground); background: var(--im-accent); }
    .icon-btn svg, .icon-btn i { width: 16px; height: 16px; }

    /* ---- 主体流式容器 ---- */
    .shell-main {
      width: 100%;
      max-width: 1152px;
      margin: 0 auto;
      padding-left: clamp(16px, 4vw, 32px);
      padding-right: clamp(16px, 4vw, 32px);
      padding-bottom: clamp(32px, 6vw, 72px);
    }

    /* ---- 页头（编辑式、克制） ---- */
    .page-hero {
      padding-top: clamp(28px, 6vw, 72px);
      padding-bottom: clamp(20px, 3.5vw, 36px);
    }
    .hero-kicker {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--im-primary);
    }
    .page-title {
      margin: 0;
      font-size: clamp(1.9rem, 4.6vw, 3.4rem);
      line-height: 1.04;
      letter-spacing: -0.03em;
      font-weight: 600;
      color: var(--im-foreground);
    }
    .hero-sub {
      margin: 12px 0 0;
      font-size: clamp(.95rem, 2vw, 1.05rem);
      color: var(--im-muted-foreground);
    }

    /* ---- 分类网格：手机 1 列 → ≥640px 2 列 → ≥1024px 4 列 ---- */
    .cat-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(14px, 2.5vw, 24px);
    }
    @media (min-width: 640px)  { .cat-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .cat-grid { grid-template-columns: repeat(4, 1fr); } }

    /* ---- 分类卡片（图片主导，窄屏正常堆叠） ---- */
    .cat-card {
      position: relative;
      display: block;
      overflow: hidden;
      min-width: 0;
      border-radius: var(--im-radius-large);
      border: 1px solid var(--im-border);
      background: var(--im-card);
      text-decoration: none;
      overflow-wrap: break-word;
      transition: transform .28s cubic-bezier(.32,.72,0,1), border-color .28s cubic-bezier(.32,.72,0,1), box-shadow .28s cubic-bezier(.32,.72,0,1);
    }
    .cat-card:hover {
      border-color: color-mix(in srgb, var(--im-primary) 45%, var(--im-border));
      transform: translateY(-4px);
      box-shadow: var(--im-shadow-lg);
    }
    .cat-card > img {
      display: block;
      width: 100%;
      height: 160px;
      object-fit: cover;
    }
    @media (min-width: 640px)  { .cat-card > img { height: 188px; } }
    @media (min-width: 1024px) { .cat-card > img { height: 210px; } }
    .cat-card .shade {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 160px;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 55%, color-mix(in srgb, var(--im-card) 92%, transparent));
    }
    @media (min-width: 640px)  { .cat-card .shade { height: 188px; } }
    @media (min-width: 1024px) { .cat-card .shade { height: 210px; } }

    .cat-icon {

      height: 44px;
      border-radius: 14px;
      flex: none;

      color: var(--im-primary);

    .cat-icon svg, .cat-icon i { width: 20px; height: 20px; }
    .cat-card h2 {
      margin: 0;
      font-size: clamp(1.05rem, 2vw, 1.2rem);
      line-height: 1.2;
      letter-spacing: -0.01em;
      color: var(--im-foreground);
    }
    .cat-card .text-lg { font-size: clamp(1.05rem, 2vw, 1.2rem); }
    .cat-card .font-bold { font-weight: 700; }
    .cat-count {
      margin: 2px 0 0;
      font-size: 12px;

    .cat-card .mt-3 { margin-top: 12px; }

    .cat-card .line-clamp-2 {

  <script src="assets/cms.js"></script>
  <script>
    (function () {
      var CMS = window.IM_CMS;
      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      CMS.loadLocal().then(function () {
        var cats = CMS.snapshot().categories || {};
        var grid = document.getElementById('cat-grid');
        if (!grid) return;
        var iconMap = { clapperboard: 'clapperboard', disc: 'disc', compass: 'compass', utensils: 'utensils' };
        var names = ['电影', '音乐', '旅行', '美食'];
        grid.innerHTML = names.map(function (name) {
          var c = cats[name] || {};
          return '<a href="index.html" class="cat-card">' +
            '<img src="' + esc(CMS.resolveAsset(c.cover)) + '" alt="' + esc(name) + '分类">' +
            '<div class="shade"></div>' +
            '<div class="cat-body">' +
            '<div class="flex items-center gap-3">' +
            '<span class="cat-icon"><i data-lucide="' + (iconMap[name] || 'tag') + '" class="h-5 w-5"></i></span>' +
            '<div class="min-w-0"><h2 class="font-display text-lg font-bold">' + esc(name) + '</h2>' +
            '<p class="cat-count">' + (c.count != null ? c.count + ' 篇' : '') + '</p></div>' +
            '</div>' +
            '<p class="mt-3 line-clamp-2 text-sm leading-relaxed text-muted-foreground">' + esc(c.desc || '') + '</p>' +
            '</div></a>';
        }).join('');
        if (window.lucide) lucide.createIcons();
      }).catch(function () { /* 保留静态分类卡片 */ });
    })();
  </script>
  <script>lucide.createIcons();</script>
