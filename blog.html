<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客创作</title>
    <style id="theme-vars">
/* ============================================================
   Im-chc 个人博客 · 苹果风格响应式主题（草稿版）
   brand prefix: im
   参考设计系统: Pinguo / Apple HIG
   要点: Space Black + Silver Mist + System Blue，DM Sans 正文、
   JetBrains Mono 技术字，1px 边框 + 轻声阴影，胶囊按钮，
   大圆角，留白优先；全设备响应式（390/768/1024/1440）。
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

/* ---------- Apple System Palette ---------- */
:root {
  /* brand blue scale (System Blue #007AFF anchored) */
  --im-primary-50: #e8f2ff;
  --im-primary-100: #cfe5ff;
  --im-primary-200: #9fcbff;
  --im-primary-300: #66abff;
  --im-primary-400: #2e8dff;
  --im-primary-500: #007aff;
  --im-primary-600: #0064d6;
  --im-primary-700: #004fad;
  --im-primary-800: #003b82;
  --im-primary-900: #00275a;

  /* neutral scale (dark: Space Black family) */
  --im-neutral-50: #f5f5f7;
  --im-neutral-100: #e3e3e8;
  --im-neutral-200: #c7c7cc;
  --im-neutral-300: #aeaeb2;
  --im-neutral-400: #8e8e93;
  --im-neutral-500: #6e6e73;
  --im-neutral-600: #48484a;
  --im-neutral-700: #3a3a3c;
  --im-neutral-800: #2c2c2e;
  --im-neutral-900: #1c1c1e;

  /* semantic state colors */
  --state-success: #34c759;
  --state-success-dark: #30d158;
  --state-warning: #ff9f0a;
  --state-error: #ff3b30;
  --state-error-dark: #ff453a;
  --state-info: #0a84ff;
}

/* ---------- Dark base (default) ---------- */
:root {
  --im-background: #000000;
  --im-foreground: #f5f5f7;
  --im-card: #1c1c1e;
  --im-card-foreground: #f5f5f7;
  --im-popover: #3a3a3c;
  --im-popover-foreground: #f5f5f7;
  --im-primary: #2e8dff;
  --im-primary-foreground: #ffffff;
  --im-muted: #1c1c1e;
  --im-muted-foreground: #8e8e93;
  --im-accent: #2c2c2e;
  --im-accent-foreground: #f5f5f7;
  --im-border: #3a3a3c;
  --im-input: #3a3a3c;
  --im-ring: rgba(46, 141, 255, 0.5);
  --im-radius-small: 8px;
  --im-radius-medium: 14px;
  --im-radius-large: 20px;
  --im-radius-full: 9999px;

  --im-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --im-shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44);
  --im-shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
}

/* ---------- Light alternative (Silver Mist family) ---------- */
.light {
  --im-background: #f5f5f7;
  --im-foreground: #1d1d1f;
  --im-card: #ffffff;
  --im-card-foreground: #1d1d1f;
  --im-popover: #ffffff;
  --im-popover-foreground: #1d1d1f;
  --im-primary: #007aff;
  --im-primary-foreground: #ffffff;
  --im-muted: #f2f2f7;
  --im-muted-foreground: #6e6e73;
  --im-accent: #f2f2f7;
  --im-accent-foreground: #1d1d1f;
  --im-border: #d1d1d6;
  --im-input: #d1d1d6;
  --im-ring: rgba(0, 122, 255, 0.35);
  --im-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --im-shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06);
  --im-shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08);
}

/* ---------- Typography ---------- */
.font-sans,
body {
  font-family: 'DM Sans', 'Noto Sans SC', system-ui, -apple-system, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

.font-display {
  font-family: 'DM Sans', 'Noto Sans SC', system-ui, sans-serif;
  letter-spacing: -0.02em;
}

.font-mono {
  font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
}

.text-hero {
  font-size: clamp(2rem, 5vw, 3.75rem);
  line-height: 0.95;
  font-weight: 600;
  letter-spacing: -0.04em;
}

.text-section {
  font-size: clamp(1.4rem, 2.4vw, 1.9rem);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.02em;
}

/* ---------- Base polish ---------- */
::selection {
  background: var(--im-primary);
  color: var(--im-primary-foreground);
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  background: var(--im-background);
  color: var(--im-foreground);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

.card-surface {
  background: var(--im-card);
  border: 1px solid var(--im-border);
  border-radius: var(--im-radius-large);
}

/* ---------- Apple component primitives (responsive) ---------- */

/* Pill button */
.btn-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 20px;
  border: none;
  border-radius: var(--im-radius-full);
  background: var(--im-primary);
  color: var(--im-primary-foreground);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: filter .18s ease, transform .18s ease, opacity .18s ease;
}
.btn-pill:hover { filter: brightness(.95); }
.btn-pill:active { transform: scale(.98); }
.btn-pill:disabled { opacity: .42; cursor: not-allowed; }

/* Secondary pill */
.btn-pill-secondary {
  background: var(--im-muted);
  color: var(--im-foreground);
  border: 1px solid var(--im-border);
}
.btn-pill-secondary:hover { filter: brightness(1.06); }

/* Top nav item (Apple Store style) */
.nav-item {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 0 14px;
  border-radius: var(--im-radius-full);
  font-size: 13px;
  font-weight: 500;
  color: var(--im-muted-foreground);
  transition: color .18s ease, background .18s ease;
  white-space: nowrap;
}
.nav-item:hover { color: var(--im-foreground); background: var(--im-accent); }
.nav-item[data-active="true"] { color: var(--im-primary); background: color-mix(in srgb, var(--im-primary) 14%, transparent); }

/* Mobile bottom tab bar (Apple-style, blur + safe-area) */
.mobile-tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 64px;
  padding-bottom: env(safe-area-inset-bottom, 0);
  border-top: 1px solid var(--im-border);
  background: color-mix(in srgb, var(--im-background) 82%, transparent);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
}
.mobile-tabbar .mtab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 44px;
  min-height: 44px;
  padding: 6px 12px;
  border-radius: var(--im-radius-medium);
  color: var(--im-muted-foreground);
  font-size: 10px;
  font-weight: 500;
  text-decoration: none;
  transition: color .18s ease;
}
.mobile-tabbar .mtab[data-active="true"] { color: var(--im-primary); }
.mobile-tabbar .mtab i { width: 20px; height: 20px; }

/* Hide top nav on mobile, show tab bar; hide tab bar on desktop */
@media (max-width: 767px) {
  .desktop-nav { display: none !important; }
  .desktop-cta { display: none !important; }
  .mobile-tabbar { display: flex; }
}
@media (min-width: 768px) {
  .mobile-tabbar { display: none; }
}

/* Fluid container */
.shell-main {
  width: 100%;
  max-width: 1152px;
  margin: 0 auto;
  padding-left: clamp(16px, 4vw, 32px);
  padding-right: clamp(16px, 4vw, 32px);
}

/* Responsive card grid helpers (fallback if Tailwind delayed) */
.grid-auto-1 { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 640px)  { .grid-auto-2 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .grid-auto-3 { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 768px)  { .grid-auto-2 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .grid-auto-4 { grid-template-columns: repeat(4, 1fr); } }

/* Minimal scrollbar (quiet, Apple-like) */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--im-neutral-700); border-radius: 9999px; }
::-webkit-scrollbar-thumb:hover { background: var(--im-neutral-600); }

<body class="min-h-screen font-sans antialiased">
  <style id="critical-layout">
    /* ============================================================
       博客创作 · 页面级关键布局（不依赖 Tailwind 也能正确渲染）
       苹果动效曲线 cubic-bezier(0.32,0.72,0,1)，150-350ms
       ============================================================ */

    /* ---------- Shell ---------- */
    .shell-root{min-height:100vh;background:var(--im-background);display:flex;flex-direction:column}

    /* ---------- Apple Store 式深色顶栏（44px） ---------- */
    .site-header{
      position:sticky;top:0;z-index:40;width:100%;height:44px;
      border-bottom:1px solid var(--im-border);
      background:color-mix(in srgb,var(--im-background) 72%,transparent);
      backdrop-filter:blur(20px) saturate(180%);
      -webkit-backdrop-filter:blur(20px) saturate(180%);
    }
    .header-inner{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      width:100%;max-width:1152px;height:44px;margin:0 auto;
      padding-left:clamp(12px,3vw,24px);padding-right:clamp(12px,3vw,24px);
    }
    .logo-mark{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:28px;height:28px;border-radius:8px;background:color-mix(in srgb,var(--im-primary) 14%,transparent);color:var(--im-primary)}
    .logo-mark-sm{width:24px;height:24px}
    .desktop-nav{display:flex;align-items:center;gap:2px;min-width:0}
    .desktop-cta{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .nav-item{
      display:inline-flex;align-items:center;height:34px;padding:0 14px;
      border-radius:9999px;font-size:13px;font-weight:500;white-space:nowrap;
      color:var(--im-muted-foreground);
      transition:color .25s cubic-bezier(.32,.72,0,1),background .25s cubic-bezier(.32,.72,0,1);
    }
    .nav-item:hover{color:var(--im-foreground);background:color-mix(in srgb,var(--im-primary) 10%,transparent)}
    .nav-item[data-active="true"]{color:var(--im-primary);background:color-mix(in srgb,var(--im-primary) 14%,transparent)}
    .conn-pill{
      display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;
      border-radius:9999px;border:1px solid var(--im-border);
      font-size:12px;color:var(--im-muted-foreground);white-space:nowrap;
    }
    .conn-dot{width:8px;height:8px;border-radius:9999px;background:var(--im-neutral-600);flex-shrink:0}
    .conn-dot[data-connected="true"]{background:var(--state-success)}
    .icon-btn{
      display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
      border-radius:9999px;color:var(--im-muted-foreground);
      transition:color .25s cubic-bezier(.32,.72,0,1),background .25s cubic-bezier(.32,.72,0,1);
    }
    .icon-btn:hover{color:var(--im-foreground);background:color-mix(in srgb,var(--im-primary) 10%,transparent)}

    /* ---------- 移动端底部 Tab Bar（显示/隐藏逻辑由 head 接管，这里仅复述关键样式） ---------- */
    .mobile-tabbar{
      position:fixed;left:0;right:0;bottom:0;z-index:50;height:64px;
      padding-bottom:env(safe-area-inset-bottom,0);
      border-top:1px solid var(--im-border);
      background:color-mix(in srgb,var(--im-background) 82%,transparent);
      backdrop-filter:blur(20px) saturate(180%);
      -webkit-backdrop-filter:blur(20px) saturate(180%);
    }
    .mobile-tabbar .mtab{
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      min-width:44px;min-height:44px;padding:6px 12px;border-radius:14px;
      color:var(--im-muted-foreground);font-size:10px;font-weight:500;text-decoration:none;
      transition:color .25s cubic-bezier(.32,.72,0,1),transform .2s cubic-bezier(.32,.72,0,1);
    }
    .mobile-tabbar .mtab:active{transform:scale(.92)}
    .mobile-tabbar .mtab[data-active="true"]{color:var(--im-primary)}
    .mobile-tabbar .mtab i{width:20px;height:20px}

    /* ---------- 页面主容器（流式宽度 + 自适应内边距） ---------- */
    .shell-main{width:100%;max-width:1152px;margin:0 auto;padding-left:clamp(16px,4vw,32px);padding-right:clamp(16px,4vw,32px)}
    .editor-page-main{
      flex:1 0 auto;width:100%;
      padding-top:clamp(18px,3vw,32px);
      padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));
    }
    @media (min-width:768px){ .editor-page-main{padding-bottom:48px} }

    /* ---------- 三栏编辑器网格（响应式重排） ---------- */
    .editor-grid{
      display:grid;
      grid-template-columns:minmax(0,1fr);
      grid-template-areas:"editor" "list" "settings";
      gap:clamp(16px,2.5vw,24px);
      align-items:start;
    }
    .aside-list{grid-area:list;min-width:0}
    .editor-col{grid-area:editor;min-width:0}
    .aside-settings{grid-area:settings;min-width:0}

    /* 平板 768-1023：左列表 + 右编辑器，发布设置移到下方整行 */
    @media (min-width:768px){
      .editor-grid{
        grid-template-columns:minmax(0,240px) minmax(0,1fr);
        grid-template-areas:"list editor" "settings settings";
      }
    }
    /* 桌面 ≥1024：三栏 */
    @media (min-width:1024px){
      .editor-grid{
        grid-template-columns:minmax(0,240px) minmax(0,1fr) minmax(0,300px);
        grid-template-areas:"list editor settings";
      }
    }

    /* ---------- 面板（大圆角 20px，1px 边框，轻声阴影） ---------- */
    .panel{
      background:var(--im-card);
      border:1px solid var(--im-border);
      border-radius:var(--im-radius-large);
      box-shadow:var(--im-shadow-sm);
      transition:box-shadow .3s cubic-bezier(.32,.72,0,1);
    }

    /* ---------- 文章列表 ---------- */
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px}
    .panel-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
    .list-scroll{display:flex;flex-direction:column;gap:4px;padding:2px 10px 14px;max-height:340px;overflow-y:auto;overscroll-behavior:contain}
    @media (min-width:768px){ .list-scroll{max-height:calc(100vh - 176px)} }
    .post-item{
      display:flex;align-items:center;gap:10px;width:100%;min-height:42px;
      border-radius:var(--im-radius-medium);padding:8px 12px;text-align:left;
      color:var(--im-muted-foreground);cursor:pointer;border:none;background:transparent;
      transition:background .22s cubic-bezier(.32,.72,0,1),color .22s cubic-bezier(.32,.72,0,1);
    }
    .post-item:hover{background:color-mix(in srgb,var(--im-primary) 9%,transparent)}
    .post-item[data-active="true"]{background:color-mix(in srgb,var(--im-primary) 15%,transparent);color:var(--im-foreground)}
    .post-item i{flex-shrink:0}
    .post-item .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .btn-new{
      display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;
      border-radius:9999px;border:none;background:var(--im-primary);color:var(--im-primary-foreground);
      cursor:pointer;flex-shrink:0;
      transition:transform .22s cubic-bezier(.32,.72,0,1),opacity .22s cubic-bezier(.32,.72,0,1);
    }
    .btn-new:hover{opacity:.92;transform:scale(1.05)}
    .btn-new:active{transform:scale(.94)}

    /* ---------- 编辑器（标题 / 副标题 / 工具栏 / 正文） ---------- */
    .editor-col:focus-within{box-shadow:0 0 0 3px var(--im-ring),var(--im-shadow-sm)}
    .editor-title{
      display:block;width:100%;height:clamp(54px,7vh,64px);padding:0 clamp(16px,2.5vw,24px);
      background:transparent;border:none;border-bottom:1px solid var(--im-border);
      color:var(--im-foreground);font-size:clamp(16px,2vw,20px);font-weight:600;letter-spacing:-.01em;
      transition:border-color .25s cubic-bezier(.32,.72,0,1),background .25s cubic-bezier(.32,.72,0,1);
    }
    .editor-title::placeholder{color:var(--im-muted-foreground)}
    .editor-title:focus{outline:none;border-bottom-color:var(--im-primary)}
    .editor-subtitle{
      display:block;width:100%;height:46px;padding:0 clamp(16px,2.5vw,24px);
      background:transparent;border:none;border-bottom:1px solid var(--im-border);
      color:var(--im-muted-foreground);font-size:14px;
      transition:border-color .25s cubic-bezier(.32,.72,0,1);
    }
    .editor-subtitle::placeholder{color:var(--im-muted-foreground);opacity:.7}
    .editor-subtitle:focus{outline:none;border-bottom-color:var(--im-primary)}
    .editor-toolbar{
      display:flex;align-items:center;gap:4px;padding:10px clamp(12px,2vw,16px);
      border-bottom:1px solid var(--im-border);background:var(--im-accent);
      overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    .editor-toolbar::-webkit-scrollbar{display:none}
    .toolbar-btn{
      display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
      width:36px;height:36px;border-radius:var(--im-radius-medium);
      color:var(--im-muted-foreground);
      transition:color .22s cubic-bezier(.32,.72,0,1),background .22s cubic-bezier(.32,.72,0,1),transform .2s cubic-bezier(.32,.72,0,1);
    }
    .toolbar-btn:hover{background:color-mix(in srgb,var(--im-primary) 12%,transparent);color:var(--im-foreground)}
    .toolbar-btn:active{transform:scale(.94)}
    .toolbar-hint{margin-left:auto;flex-shrink:0;font-size:12px;color:var(--im-muted-foreground);white-space:nowrap}
    @media (max-width:640px){ .toolbar-hint{display:none} }
    .editor-content{
      display:block;width:100%;min-height:clamp(280px,46vh,520px);
      padding:clamp(14px,2vw,20px) clamp(16px,2.5vw,24px);
      background:transparent;border:none;resize:vertical;
      color:var(--im-foreground);font-size:14px;line-height:1.85;
      overflow-wrap:break-word;
    }
    .editor-content::placeholder{color:var(--im-muted-foreground)}
    .editor-content:focus{outline:none}

    /* ---------- 发布设置 ---------- */
    .settings-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
    @media (min-width:768px) and (max-width:1023px){
      .settings-stack{grid-template-columns:repeat(2,minmax(0,1fr))}
      .settings-stack .span-2{grid-column:1 / -1}
    }
    .settings-card{padding:clamp(16px,2.5vw,20px)}
    .field-label{display:block;font-size:12px;font-weight:600;color:var(--im-foreground);margin-bottom:10px;letter-spacing:.01em}
    .input{
      width:100%;height:46px;border-radius:var(--im-radius-medium);
      border:1px solid var(--im-border);background:var(--im-card);color:var(--im-foreground);
      padding:0 14px;font-size:14px;
      transition:border-color .25s cubic-bezier(.32,.72,0,1),box-shadow .25s cubic-bezier(.32,.72,0,1);
    }
    .input::placeholder{color:var(--im-muted-foreground)}
    .input:focus{outline:none;border-color:var(--im-primary);box-shadow:0 0 0 3px var(--im-ring)}
    .note{font-size:12px;line-height:1.7;color:var(--im-muted-foreground);margin:10px 0 14px;overflow-wrap:break-word}
    .note code{
      font-family:'JetBrains Mono',ui-monospace,'SF Mono',monospace;font-size:11px;
      border-radius:6px;background:var(--im-muted);padding:2px 6px;color:var(--im-foreground);
      border:1px solid var(--im-border);
    }
    .chip-wrap{display:flex;flex-wrap:wrap;gap:8px}
    .chip{
      display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;
      border-radius:9999px;border:1px solid var(--im-border);background:var(--im-card);
      color:var(--im-muted-foreground);font-size:13px;cursor:pointer;white-space:nowrap;
      transition:all .22s cubic-bezier(.32,.72,0,1);
    }
    .chip:hover{border-color:color-mix(in srgb,var(--im-primary) 45%,var(--im-border));color:var(--im-foreground)}
    .chip[data-active="true"]{background:color-mix(in srgb,var(--im-primary) 14%,transparent);border-color:var(--im-primary);color:var(--im-primary)}
    .cover-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .pick{
      position:relative;aspect-ratio:16/9;border-radius:var(--im-radius-medium);overflow:hidden;
      border:1px solid var(--im-border);background:var(--im-muted);cursor:pointer;padding:0;
      transition:border-color .22s cubic-bezier(.32,.72,0,1),box-shadow .22s cubic-bezier(.32,.72,0,1),transform .22s cubic-bezier(.32,.72,0,1);
    }
    .pick img{width:100%;height:100%;object-fit:cover;display:block}
    .pick:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--im-primary) 45%,var(--im-border))}
    .pick[data-active="true"]{border-color:var(--im-primary);box-shadow:0 0 0 2px var(--im-ring)}
    .pick .check{
      position:absolute;top:8px;right:8px;display:flex;align-items:center;justify-content:center;
      width:22px;height:22px;border-radius:9999px;background:var(--im-primary);color:var(--im-primary-foreground);
      box-shadow:var(--im-shadow-sm);
    }
    .actions-row{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
    @media (min-width:768px) and (max-width:1023px){ .actions-row{grid-template-columns:repeat(2,minmax(0,1fr))} }
    .btn-primary{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      width:100%;min-height:48px;padding:0 22px;border-radius:9999px;border:none;
      background:var(--im-primary);color:var(--im-primary-foreground);
      font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;
      transition:transform .22s cubic-bezier(.32,.72,0,1),opacity .22s cubic-bezier(.32,.72,0,1),box-shadow .22s cubic-bezier(.32,.72,0,1);
    }
    .btn-primary:hover{opacity:.94;box-shadow:var(--im-shadow-md)}
    .btn-primary:active{transform:scale(.98)}
    .btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-secondary{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      width:100%;min-height:44px;padding:0 20px;border-radius:9999px;
      border:1px solid var(--im-border);background:var(--im-card);color:var(--im-foreground);
      font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;
      transition:border-color .22s cubic-bezier(.32,.72,0,1),background .22s cubic-bezier(.32,.72,0,1),transform .22s cubic-bezier(.32,.72,0,1);
    }
    .btn-secondary:hover{border-color:color-mix(in srgb,var(--im-primary) 45%,var(--im-border));background:var(--im-accent)}
    .btn-secondary:active{transform:scale(.98)}
    .btn-secondary:disabled{opacity:.45;cursor:not-allowed;transform:none}

    /* ---------- Toast ---------- */
    .toast{
      position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);
      z-index:60;padding:12px 20px;border-radius:9999px;
      font-size:13px;font-weight:500;text-align:center;max-width:80vw;
      background:var(--im-popover);border:1px solid var(--im-border);box-shadow:var(--im-shadow-lg);
      opacity:0;pointer-events:none;
      transition:opacity .3s cubic-bezier(.32,.72,0,1),transform .3s cubic-bezier(.32,.72,0,1);
    }
    .toast[data-show="true"]{opacity:1;transform:translateX(-50%) translateY(0)}
    @media (max-width:767px){ .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))} }

    /* ---------- 页脚 ---------- */
    .site-footer{width:100%;border-top:1px solid var(--im-border);background:var(--im-background)}
    .footer-inner{
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      width:100%;max-width:1152px;margin:0 auto;padding:24px clamp(16px,4vw,32px);
    }

    /* ---------- 移动端字号（≥16px，避免 iOS 聚焦缩放） ---------- */
    @media (max-width:767px){
      .input,.editor-title,.editor-subtitle,.editor-content{font-size:16px}
      .list-scroll{max-height:320px}
    }
  </style>

  <script src="assets/cms.js"></script>
  <script>
    (function () {
      var CMS = window.IM_CMS;
      var currentId = null;
      var token = CMS.getToken();
      var listEl = document.getElementById('post-list');
      var titleInput = document.getElementById('title-input');
      var subtitleInput = document.getElementById('subtitle-input');
      var contentInput = document.getElementById('content-input');
      var tokenInput = document.getElementById('token-input');
      var btnConnect = document.getElementById('btn-connect');
      var btnPublish = document.getElementById('btn-publish');
      var btnDelete = document.getElementById('btn-delete');
      var btnNew = document.getElementById('btn-new');
      var connDot = document.getElementById('conn-dot');
      var connLabel = document.getElementById('conn-label');
      var toast = document.getElementById('toast');
      var toastTimer = null;

      var catEls = Array.prototype.slice.call(document.querySelectorAll('#cat-chips .chip'));
      var coverEls = Array.prototype.slice.call(document.querySelectorAll('#cover-picks .pick'));
      var selectedCat = null;
      var selectedCover = null;

      tokenInput.value = token || '';
      if (token) { setConn(true, '已连接'); } else { setConn(false, '未连接'); }

      function setConn(ok, label) {
        connDot.setAttribute('data-connected', ok ? 'true' : 'false');
        connLabel.textContent = label || (ok ? '已连接' : '未连接');
      }
      function showToast(msg) {
        toast.textContent = msg;
        toast.setAttribute('data-show', 'true');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.setAttribute('data-show', 'false'); }, 2600);
      }
      function renderList() {
        listEl.innerHTML = '';
        var posts = CMS.latest(50);
        if (!posts.length) {
          var empty = document.createElement('p');
          empty.className = 'px-2 py-6 text-center text-xs text-muted-foreground';
          empty.textContent = '暂无文章，点击右上角新建';
          listEl.appendChild(empty);
        }
        posts.forEach(function (p) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'post-item' + (p.id === currentId ? ' [data-active]' : '');
          if (p.id === currentId) btn.setAttribute('data-active', 'true');
          btn.innerHTML = '<i data-lucide="file-text" class="h-4 w-4 shrink-0"></i><span class="truncate text-[13px]">' + esc(p.title || '未命名') + '</span>';
          btn.addEventListener('click', function () { loadPost(p.id); });
          listEl.appendChild(btn);
        });
        if (window.lucide) lucide.createIcons();
      }
      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
      function loadPost(id) {
        var p = CMS.getPost(id);
        if (!p) return;
        currentId = id;
        titleInput.value = p.title || '';
        subtitleInput.value = p.subtitle || '';
        contentInput.value = p.content || '';
        selectedCat = p.category || null;
        selectedCover = p.cover || null;
        updateChips();
        updateCovers();
        renderList();
        btnPublish.disabled = !token;
        btnDelete.disabled = false;
      }
      function newPost() {
        currentId = null;
        titleInput.value = '';
        subtitleInput.value = '';
        contentInput.value = '';
        selectedCat = null;
        selectedCover = null;
        updateChips();
        updateCovers();
        renderList();
        btnDelete.disabled = true;
        btnPublish.disabled = !token;
        titleInput.focus();
      }
      function updateChips() {
        catEls.forEach(function (c) {
          var on = c.getAttribute('data-cat') === selectedCat;
          c.setAttribute('data-active', on ? 'true' : 'false');
        });
      }
      function updateCovers() {
        coverEls.forEach(function (c) {
          var on = c.getAttribute('data-cover') === selectedCover;
          c.setAttribute('data-active', on ? 'true' : 'false');
          var check = c.querySelector('.check');
          if (on && !check) {
            var s = document.createElement('span');
            s.className = 'check';
            s.innerHTML = '<i data-lucide="check" class="h-3 w-3"></i>';
            c.appendChild(s);
            if (window.lucide) lucide.createIcons();
          } else if (!on && check) {
            check.remove();
          }
        });
      }

      /* 交互：分类 / 封面 */
      catEls.forEach(function (c) {
        c.addEventListener('click', function () {
          selectedCat = c.getAttribute('data-cat') === selectedCat ? null : c.getAttribute('data-cat');
          updateChips();
        });
      });
      coverEls.forEach(function (c) {
        c.addEventListener('click', function () {
          selectedCover = c.getAttribute('data-cover');
          updateCovers();
        });
      });

      /* 工具栏插入 Markdown */
      Array.prototype.forEach.call(document.querySelectorAll('.toolbar-btn[data-md]'), function (b) {
        b.addEventListener('click', function () {
          var kind = b.getAttribute('data-md');
          var s = contentInput.selectionStart, e = contentInput.selectionEnd;
          var sel = contentInput.value.slice(s, e) || '文本';
          var wrap = { bold: '**' + sel + '**', italic: '_' + sel + '_', h2: '\n## ' + sel + '\n', quote: '\n> ' + sel + '\n' }[kind];
          contentInput.value = contentInput.value.slice(0, s) + wrap + contentInput.value.slice(e);
          contentInput.focus();
        });
      });

      /* 连接 */
      btnConnect.addEventListener('click', function () {
        var t = tokenInput.value.trim();
        if (!t) { showToast('请先粘贴 GitHub Token'); return; }
        btnConnect.disabled = true;
        btnConnect.innerHTML = '<i data-lucide="loader" class="h-4 w-4 animate-spin"></i>连接中…';
        if (window.lucide) lucide.createIcons();
        CMS.loadFromGithub(t).then(function () {
          token = t;
          CMS.setToken(t);
          setConn(true, '已连接');
          btnPublish.disabled = false;
          if (!currentId) { loadPost(CMS.latest(1)[0] ? CMS.latest(1)[0].id : null); }
          if (!currentId) newPost();
          showToast('已连接，文章已从仓库加载');
        }).catch(function (err) {
          if (err.message === 'BAD_TOKEN') { showToast('Token 无效或无权限，请检查'); }
          else if (err.message === 'NOT_FOUND') { showToast('仓库中未找到 data/posts.json'); }
          else { showToast('连接失败：' + err.message); }
        }).finally(function () {
          btnConnect.disabled = false;
          btnConnect.innerHTML = '<i data-lucide="plug" class="h-4 w-4"></i>连接并加载';
          if (window.lucide) lucide.createIcons();
        });
      });

      /* 发布 */
      function collect() {
        var posts = CMS.latest(50).map(function (p) { return p; });
        var post = null;
        if (currentId) {
          for (var i = 0; i < posts.length; i++) { if (posts[i].id === currentId) { post = posts[i]; break; } }
        }
        if (!post) {
          post = { id: 'post-' + Date.now(), featured: false };
          posts.unshift(post);
        }
        post.title = titleInput.value.trim() || '未命名文章';
        post.subtitle = subtitleInput.value.trim();
        post.category = selectedCat || '生活';
        post.cover = selectedCover || 'assets/carousel-morning.svg';
        post.content = contentInput.value;
        post.excerpt = (contentInput.value || '').replace(/[#>*\n]/g, ' ').trim().slice(0, 80) || post.subtitle;
        if (!post.date) { var d = new Date(); post.date = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); }
        return posts;
      }
      btnPublish.addEventListener('click', function () {
        if (!token) { showToast('请先连接 GitHub'); return; }
        var snapshot = CMS.snapshot();
        snapshot.posts = collect();
        btnPublish.disabled = true;
        var original = btnPublish.innerHTML;
        btnPublish.innerHTML = '<i data-lucide="loader" class="h-4 w-4 animate-spin"></i>同步中…';
        if (window.lucide) lucide.createIcons();
        CMS.saveToGithub(snapshot, token, '更新博客内容').then(function () {
          showToast('已发布，仓库已更新，稍候自动重新部署');
        }).catch(function (err) {
          if (err.message === 'BAD_TOKEN') { showToast('Token 无写权限，请检查'); }
          else { showToast('同步失败：' + err.message); }
        }).finally(function () {
          btnPublish.innerHTML = original;
          btnPublish.disabled = false;
          if (window.lucide) lucide.createIcons();
        });
      });

      /* 删除 */
      btnDelete.addEventListener('click', function () {
        if (!currentId) return;
        var posts = collect().filter(function (p) { return p.id !== currentId; });
        var snapshot = CMS.snapshot();
        snapshot.posts = posts;
        btnDelete.disabled = true;
        CMS.saveToGithub(snapshot, token, '删除文章').then(function () {
          showToast('已删除并同步到仓库');
          newPost();
        }).catch(function (err) { showToast('删除失败：' + err.message); }).finally(function () {
          btnDelete.disabled = false;
        });
      });

      btnNew.addEventListener('click', newPost);

      /* 初始：无 token 时也加载本地数据作为预览 */
      CMS.loadLocal().then(function () {
        if (!token) {
          if (CMS.latest(1).length) { loadPost(CMS.latest(1)[0].id); }
          else { newPost(); }
        }
      }).catch(function () { /* 忽略，等待用户连接 */ });
    })();
  </script>
  <script>lucide.createIcons();</script>
</body>
</html>
